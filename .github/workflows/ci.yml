name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security guards (secrets, gitignore, permissions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tracked-file check needs real history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guard credentials, .gitignore and pre-approved permissions
        run: python tools/security_guards.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests openpyxl
      - name: Run the suite
        run: python tests/run_tests.py

  lint:
    name: Lint (ruff) + config validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pyyaml
      - name: Ruff (new modules must stay clean)
        run: ruff check --output-format=github $(cat .ruff-paths | tr '\n' ' ')
      - name: config.example.yaml must parse
        run: python -c "import yaml,sys; yaml.safe_load(open('config.example.yaml')); print('config.example.yaml OK')"

  extension:
    name: Browser extension (manifest + JS syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: JS syntax check
        run: |
          for f in browser_extension/*.js browser_extension/lib/*.js browser_extension/content/*.js; do
            node --check "$f" || exit 1
          done
          echo "all extension JS parses"
      - name: Manifest + provider placeholders + no committed keys
        run: python -m unittest tests.test_browser_extension -v
